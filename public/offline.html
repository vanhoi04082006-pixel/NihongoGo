<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ngoại tuyến — NihongoGo</title>
    <style>
      :root { color-scheme: light dark }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        background: #faf7f1;
        color: #2b2620;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #16131d; color: #f0ede7 }
        .card { background: #1f1b29 !important; border-color: #322d42 !important }
      }
      .card {
        max-width: 380px;
        margin: 16px;
        padding: 40px 32px;
        border: 1px solid #e7e0d3;
        border-radius: 24px;
        background: #ffffff;
        text-align: center;
      }
      .mark { display: inline-block; margin-bottom: 18px }
      h1 { font-size: 22px; margin: 0 0 8px }
      p { font-size: 14px; line-height: 1.6; color: #847c6e; margin: 0 0 24px }
      a {
        display: inline-block;
        padding: 12px 28px;
        border-radius: 14px;
        background: #4f46e5;
        color: #fff;
        font-weight: 700;
        font-size: 15px;
        text-decoration: none;
      }
      .hint { margin-top: 18px; font-size: 12px; color: #847c6e }
    </style>
  </head>
  <body>
    <main class="card">
      <svg class="mark" width="64" height="64" viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <rect x="2" y="2" width="44" height="44" rx="14" fill="#4f46e5" />
        <circle cx="24" cy="26" r="10" fill="#e8609a" />
        <path d="M10 16.5c4.5-2.2 9-3.3 14-3.3s9.5 1.1 14 3.3" stroke="#fff" stroke-width="3.4" stroke-linecap="round" />
        <path d="M24 14.5v20" stroke="#fff" stroke-width="3.4" stroke-linecap="round" />
        <path d="M15.5 22h17" stroke="#fff" stroke-width="3.4" stroke-linecap="round" />
      </svg>
      <h1>Bạn đang ngoại tuyến</h1>
      <p>
        Hãy kết nối lại Internet để tiếp tục hành trình học tiếng Nhật. Tiến độ, chuỗi ngày và XP của bạn
        được lưu an toàn trên máy chủ — không mất gì cả.
      </p>
      <a href="/">Thử lại</a>
      <p class="hint">Mẹo: các trang đã xem (kana, từ vựng) vẫn hoạt động khi ngoại tuyến.</p>
    </main>
  </body>
</html>
